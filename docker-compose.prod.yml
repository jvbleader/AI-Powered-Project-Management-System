name: flowpilot-prod

services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_PORT}"
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis/redis-stack-server:7.4.0-v1
    restart: always
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-migrate:
    image: flowpilot-backend:prod
    pull_policy: never
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
      - ./backend/.env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      PYTHONPATH: /app
    entrypoint: ["python", "scripts/migrate_db.py"]

  db-seed:
    image: mysql:8.4
    restart: "no"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SEED_SQL_PATH: /seed/backup.sql
    volumes:
      - ./database/seed:/seed:ro
    entrypoint: ["/bin/bash", "/seed/seed.sh"]

  backend:
    image: flowpilot-backend:prod
    pull_policy: never
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      db-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
      - ./backend/.env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      BACKEND_WORKERS: ${BACKEND_WORKERS}
      PYTHONPATH: /app
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
    expose:
      - "${BACKEND_PORT}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT}/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: flowpilot-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-same-origin}
        NEXT_PUBLIC_API_PORT: ${NEXT_PUBLIC_API_PORT:-}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-same-origin}
      NEXT_PUBLIC_API_PORT: ${NEXT_PUBLIC_API_PORT:-}
      API_BASE_URL_INTERNAL: http://backend:${BACKEND_PORT}
    expose:
      - "${FRONTEND_PORT}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:${FRONTEND_PORT}').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  nginx:
    image: flowpilot-nginx:prod
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    environment:
      TZ: ${TZ}
    command: ["/bin/sh", "-c", "nginx -t && exec nginx -g 'daemon off;'"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  mysql_data_prod:
  redis_data_prod:
  nginx_logs:
