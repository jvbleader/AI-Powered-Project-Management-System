name: flowpilot-dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_PORT}"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis/redis-stack-server:7.4.0-v1
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: uses the same image built by `backend` (do not duplicate build:)
  db-migrate:
    image: flowpilot-backend:dev
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
      - ./backend/.env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
    entrypoint: ["python", "scripts/migrate_db.py"]

  db-seed:
    image: mysql:8.4
    restart: "no"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SEED_SQL_PATH: /seed/backup.sql
    volumes:
      - ./database/seed:/seed:ro
    entrypoint: ["/bin/bash", "/seed/seed.sh"]

  backend:
    image: flowpilot-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
      - ./backend/.env
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      PYTHONPATH: /app
      # Allow browser E2E from the compose service hostname as well as localhost.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://localhost:3000,http://frontend:3000,http://host.docker.internal:3000}
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT}/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: flowpilot-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT}
      NEXT_PUBLIC_API_PORT: ${BACKEND_HOST_PORT}
      API_BASE_URL_INTERNAL: http://backend:${BACKEND_PORT}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_PORT}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:${FRONTEND_PORT}').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

volumes:
  mysql_data_dev:
  redis_data_dev:
