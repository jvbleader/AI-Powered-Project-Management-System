# Shared by HTTP and TLS server blocks.

location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location = /nginx-status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;
}

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    allow all;
}

location ~ ^/(docs|redoc|openapi\.json)$ {
    return 404;
}

location = /api/ai/chat {
    limit_req  zone=ai burst=3 nodelay;
    limit_conn conn 20;
    include    /etc/nginx/snippets/proxy-sse.conf;
}

location = /api/notifications/ws {
    limit_conn conn 8;
    include    /etc/nginx/snippets/proxy-websocket.conf;
}

location ^~ /api/ {
    limit_req zone=api burst=40 nodelay;
    include   /etc/nginx/snippets/proxy-backend.conf;
}

location = /health {
    access_log off;
    include    /etc/nginx/snippets/proxy-backend.conf;
}

location = /login {
    limit_req          zone=login burst=5 nodelay;
    client_max_body_size 32k;
    proxy_pass         http://$login_upstream;
    include            /etc/nginx/snippets/proxy-params.conf;
    proxy_set_header   Connection "";
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
}

location = /logout {
    include /etc/nginx/snippets/proxy-backend.conf;
}

location = /logout-all {
    include /etc/nginx/snippets/proxy-backend.conf;
}

location = /refresh {
    include /etc/nginx/snippets/proxy-backend.conf;
}

location = /change-password {
    client_max_body_size 32k;
    include /etc/nginx/snippets/proxy-backend.conf;
}

location ^~ /me {
    limit_req zone=api burst=20 nodelay;
    include   /etc/nginx/snippets/proxy-backend.conf;
}

location ^~ /_next/static/ {
    include           /etc/nginx/snippets/proxy-frontend.conf;
    proxy_hide_header Cache-Control;
    include           /etc/nginx/snippets/security-headers.conf;
    add_header        Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
    limit_conn conn 40;
    include    /etc/nginx/snippets/proxy-frontend.conf;
}
