map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# GET /login → Next.js page. POST /login → FastAPI.
map $request_method $login_upstream {
    GET     flowpilot_frontend;
    HEAD    flowpilot_frontend;
    OPTIONS flowpilot_frontend;
    default flowpilot_backend;
}

# Rate-limit login POSTs only. Empty key is ignored by limit_req.
map $request_method $limit_login_key {
    POST    $binary_remote_addr;
    default "";
}
