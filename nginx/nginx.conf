# =============================================================================
# FlowPilot — nginx entrypoint
#
# Public traffic:   :80 / :443  →  this process
# App traffic:      /api, /me, auth  →  FastAPI  (upstream flowpilot_backend)
#                   everything else  →  Next.js  (upstream flowpilot_frontend)
#
# Reload after edits:  docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

worker_rlimit_nofile  65535;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    server_tokens off;
    server_names_hash_bucket_size 64;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65s;
    keepalive_requests  1000;
    reset_timedout_connection on;

    # Avatars travel as base64 JSON on PUT /me/avatar.
    client_max_body_size        20m;
    client_body_timeout         30s;
    client_header_timeout       15s;
    large_client_header_buffers 4 16k;
    client_body_buffer_size     128k;

    log_format json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$request_id",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"query":"$args",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"upstream":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"ref":"$http_referer",'
            '"ua":"$http_user_agent",'
            '"host":"$host",'
            '"proto":"$server_protocol",'
            '"scheme":"$scheme"'
        '}';

    access_log /var/log/nginx/access.log json;

    include /etc/nginx/snippets/maps.conf;
    include /etc/nginx/snippets/gzip.conf;
    include /etc/nginx/snippets/real-ip.conf;

    # POST /login only (see map $limit_login_key).
    limit_req_zone $limit_login_key zone=login:10m  rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=40r/s;
    limit_req_zone $binary_remote_addr zone=ai:10m     rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    limit_req_status      429;
    limit_req_log_level   warn;
    limit_conn_status     429;

    # Compose/Swarm DNS — required when proxy_pass uses $login_upstream.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}
