# Scale-out: add extra stable DNS names (backend-2, backend-3) rather than
# `docker compose --scale` — nginx resolves these once unless you reload.

upstream flowpilot_backend {
    least_conn;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;

    server backend:8000 max_fails=3 fail_timeout=10s;
}

upstream flowpilot_frontend {
    least_conn;
    keepalive 16;
    keepalive_requests 1000;
    keepalive_timeout 60s;

    server frontend:3000 max_fails=3 fail_timeout=10s;
}
