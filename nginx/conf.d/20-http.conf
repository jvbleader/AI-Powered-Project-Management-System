# HTTP public entry. Fits local/staging and TLS-terminated load balancers.
#
# To terminate TLS here:
#   1. Place fullchain.pem + privkey.pem in nginx/certs/
#   2. cp nginx/conf.d/tls.conf.example nginx/conf.d/30-tls.conf
#   3. Uncomment the redirect block below and comment out the locations include
#   4. docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    # location ^~ /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    #     default_type text/plain;
    # }
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/locations.conf;
}
